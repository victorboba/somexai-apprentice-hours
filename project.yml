name: ApprenticeHours
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ApprenticeHours:
    type: application
    platform: iOS
    sources:
      - path: ApprenticeHours
      - path: Shared
    dependencies:
      - target: ApprenticeHoursWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apprentice-hours
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ApprenticeHours/ApprenticeHours.entitlements
    info:
      path: ApprenticeHours/Info.plist
      properties:
        CFBundleDisplayName: Apprentice Hours
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  ApprenticeHoursWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ApprenticeHoursWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apprentice-hours.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: ApprenticeHoursWidget/ApprenticeHoursWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: ApprenticeHoursWidget/Info.plist
      properties:
        CFBundleDisplayName: Apprentice Hours Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ApprenticeHoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ApprenticeHoursTests
    dependencies:
      - target: ApprenticeHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apprentice-hours.tests
        GENERATE_INFOPLIST_FILE: YES
  ApprenticeHoursUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ApprenticeHoursUITests
    dependencies:
      - target: ApprenticeHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.apprentice-hours.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ApprenticeHours
schemes:
  ApprenticeHours:
    build:
      targets:
        ApprenticeHours: all
        ApprenticeHoursTests: [test]
        ApprenticeHoursUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ApprenticeHours/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: ApprenticeHours/StoreKit/Products.storekit
      targets:
        - ApprenticeHoursTests
        - ApprenticeHoursUITests
    archive:
      config: Release
